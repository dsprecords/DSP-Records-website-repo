<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Releases – DSP Records</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DSP Records upcoming releases and schedule." />

  <style>
    html, body { width:100%; max-width:none; overflow-x:hidden; }
    body { margin:0; padding:0; }
    * { box-sizing:border-box; }
    img { max-width:100%; height:auto; display:block; }

    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --text:#fff;
      --muted:#bdbdbd;
      --line:#151515;
      --accent:#f2c400;
      --radius: 16px;
      --content: 750px;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      font-size: 20px;
      text-align: center;
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
      width:100%;
      max-width: var(--content);
      margin: 0 auto;
      padding: 0 50px;
    }

    /* TOP NAV — MATCH HOME PAGE */
    .site-header{
      border-bottom:1px solid var(--line);
      background:#050505;
    }
    .header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:10px 50px;
    }
    .logo-text{
      font-size:0.9rem;
      text-transform:uppercase;
      letter-spacing:0.25em;
      font-weight:700;
      white-space:nowrap;
    }
    .nav{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.16em;
      justify-content:flex-end;
    }
    .nav a{
      position:relative;
      padding:4px 0;
      color:var(--muted);
    }
    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-3px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--accent), transparent);
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .15s ease-out;
    }
    .nav a:hover{ color:#fff; }
    .nav a:hover::after{ transform:scaleX(1); }

    section{
      padding:60px 0;
      border-bottom:1px solid var(--line);
    }
    h1{
      margin:22px 0 8px;
      font-size:2.4rem;
      letter-spacing:.5px;
    }
    p{
      margin:0 0 14px;
      color:var(--muted);
      font-size:1.05rem;
    }

    .release-img{
      width: min(900px, 100%);
      height:auto;
      display:block;
      margin: 18px auto 0;
      border-radius: var(--radius);
      border:1px solid #1a1a1a;
      background:#000;
      box-shadow:0 18px 40px rgba(0,0,0,.7);
    }

    footer{
     .release-list{
    max-width:1000px;
    margin:40px auto 0;
}

.release-card{
    display:flex;
    align-items:center;
    gap:20px;

    padding:16px;
    margin-bottom:12px;

    background:#0b0b0b;
    border:1px solid #1a1a1a;
    border-radius:16px;

    transition:.2s ease;
}

.release-card:hover{
    background:#111;
    border-color:#333;
}

.release-card img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
    flex-shrink:0;
}

.release-info{
    text-align:left;
}

.release-title{
    font-size:1.2rem;
    color:#fff;
    font-weight:700;
}

.release-artist{
    color:#f2c400;
    margin-top:4px;
}

.release-date{
    color:#888;
    margin-top:4px;
    font-size:.9rem;
}

@media (max-width:700px){

    .release-card{
        gap:12px;
    }

    .release-card img{
        width:70px;
        height:70px;
    }

    .release-title{
        font-size:1rem;
    }
}
  </style>
</head>

<body>

  <!-- TOP NAV — MATCH HOME PAGE + LEGACY ARCHIVE LABEL -->
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="logo-text">DSP RECORDS</div>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="listen.html">Listen</a>
        <a href="releases.html">Releases</a>
        <a href="past-events.html">Legacy Archive</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="wrap">
        <h1>Release Schedule</h1>
        <p>Current DSP Records schedule and upcoming drops.</p>
      </div>
    </section>
  </main>
<div class="release-list">

    <a class="release-card" href="https://soundcloud.com/dj-elixir-2" target="_blank">

        <img
            src="assets/artist-promotions/elixir/DSP_Records_V2_Cylons_Are_Coming_elixir_Cover_Art.png"
            alt="The Cylons Are Coming Cover">

        <div class="release-info">
            <div class="release-title">
                The Cylons Are Coming
            </div>

            <div class="release-artist">
                ELIXIR
            </div>

            <div class="release-date">
                November 26, 2026
            </div>
        </div>

    </a>

</div>
  <footer>
    © <span id="y"></span> DSP Records
  </footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>

</body>
</html>
