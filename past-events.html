<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DSP Legacy Image Archive – DSP Records</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="DSP legacy image archive — past DSP Records hosted events including New Year's Eve 2013 at Liquid Nightclub, Whiskey Creek, Sinfully Seductive Saturdays, Defunk hosted nights, DSP DJ sets, and event posters."
  />

  <style>
    :root{
      --bg:#000;
      --text:#fff;
      --muted:#bdbdbd;
      --line:#151515;
      --accent:#f2c400;
      --content: 1200px;
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; max-width:none; overflow-x:hidden; }
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      text-align:center;
    }
    a{ color:inherit; text-decoration:none; }

    /* Header */
    .site-header{
      border-bottom:1px solid var(--line);
      background:#050505;
    }
    .header-inner{
      max-width: var(--content);
      margin:0 auto;
      padding:10px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .logo-text{
      font-size:0.9rem;
      text-transform:uppercase;
      letter-spacing:0.25em;
      font-weight:700;
      white-space:nowrap;
    }
    .nav{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.16em;
      justify-content:flex-end;
    }
    .nav a{ color:var(--muted); padding:4px 0; }
    .nav a:hover{ color:#fff; }

    /* Page */
    .wrap{
      max-width: var(--content);
      margin:0 auto;
      padding: 34px 24px 70px;
      text-align:left;
    }
    h1{
      margin:0 0 10px;
      font-size:2.2rem;
      letter-spacing:.4px;
      text-align:center;
    }
    .intro{
      margin:0 auto 28px;
      max-width: 920px;
      color:var(--muted);
      font-size:1.02rem;
      text-align:center;
      line-height:1.6;
    }

    /* Sections */
    .section{
      margin: 36px 0 8px;
      padding-top: 10px;
      border-top:1px solid var(--line);
    }
    .section:first-of-type{ border-top:none; }
    .section h2{
      margin: 10px 0 14px;
      font-size: 1.35rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color:#fff;
      text-align:left;
    }

    /*
      Masonry-like layout without fixed boxes:
      - columns create an auto-flowing “wall of images”
      - no dedicated card sizes
      - images keep natural aspect ratios
    */
    .masonry{
      column-width: 320px;     /* adjust: larger = fewer columns */
      column-gap: 14px;
    }

    .masonry img{
      width: 100%;
      height: auto;
      display:block;
      margin: 0 0 14px;
      break-inside: avoid;
      border-radius: 10px;     /* optional, subtle */
      background: transparent; /* no black bars */
    }

    /* Faster loading + nicer look */
    .masonry img{
      filter: none;
      transform: translateZ(0);
    }

    /* Small screens */
    @media (max-width: 680px){
      .wrap{ padding: 28px 16px 56px; }
      .masonry{ column-width: 220px; column-gap: 10px; }
      .masonry img{ margin-bottom: 10px; border-radius: 8px; }
      .section h2{ text-align:center; }
    }

    footer{
      padding: 22px 24px;
      text-align:center;
      font-size: 0.9rem;
      color:#666;
      border-top:1px solid var(--line);
      background:#050505;
      margin-top:44px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-text">DSP RECORDS</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="listen.html">Listen</a>
        <a href="releases.html">Releases</a>
        <a href="past-events.html">Past Events</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">

      <p class="intro">

</html>
