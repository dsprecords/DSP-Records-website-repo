<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Past Events – DSP Records</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Past DSP Records hosted events including New Year's Eve 2013 at Liquid Nightclub, Whiskey Creek, Defunk live shows, Halloween at Sal's, and Aurora Nightclub in Banff." />

  <style>
    html, body { width:100%; max-width:none; overflow-x:hidden; }
    body { margin:0; padding:0; }
    * { box-sizing:border-box; }
    img { max-width:100%; }

    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --text:#fff;
      --muted:#bdbdbd;
      --line:#151515;
      --accent:#f2c400;
      --radius: 16px;
      --content: 1100px;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 18px;
      text-align: center;
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
      width:100%;
      max-width: var(--content);
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .site-header{
      border-bottom:1px solid var(--line);
      background:#050505;
    }
    .header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:10px 24px;
    }
    .logo-text{
      font-size:0.9rem;
      text-transform:uppercase;
      letter-spacing:0.25em;
      font-weight:700;
    }
    .nav{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.16em;
    }
    .nav a{
      position:relative;
      padding:4px 0;
      color:var(--muted);
    }
    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-3px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--accent), transparent);
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .15s ease-out;
    }
    .nav a:hover{
      color:#fff;
    }
    .nav a:hover::after{
      transform:scaleX(1);
    }

    main{
      padding-top:40px;
    }
    h1{
      margin:0 0 8px;
      font-size:2.4rem;
      letter-spacing:.5px;
    }
    .intro{
      max-width:820px;
      margin:0 auto 26px;
      color:var(--muted);
      font-size:1.02rem;
    }

    .event-section{
      margin-top:38px;
      text-align:left;
    }
    .event-section h2{
      margin:0 0 6px;
      font-size:1.8rem;
      text-align:left;
    }
    .event-meta-top{
      text-align:left;
      color:#c7c7c7;
      margin:0 0 18px;
      font-size:.96rem;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap:18px;
      text-align:left;
    }
    .event-card{
      background: var(--panel);
      border-radius: var(--radius);
      border:1px solid var(--line);
      box-shadow:0 18px 40px rgba(0,0,0,.7);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .event-card img{
      width:100%;
      display:block;
      object-fit:cover;
    }
    .event-card figcaption{
      padding:10px 14px 12px;
    }
    .event-name{
      font-size:.98rem;
      font-weight:600;
      margin:0 0 4px;
    }
    .event-meta{
      font-size:.86rem;
      color:var(--muted);
      margin:0;
    }

    footer{
      padding: 24px;
      text-align:center;
      font-size: 0.9rem;
      color:#666;
    }

    @media (max-width:700px){
      .wrap{ padding:0 16px 40px; }
      .event-section h2{ text-align:center; }
      .event-meta-top{ text-align:center; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="logo-text">DSP RECORDS</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="listen.html">Listen</a>
        <a href="releases.html">Releases</a>
        <a href="past-events.html">Past Events</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Past DSP Hosted Events</h1>
      <p class="intro">
     
  <footer>
    © <span id="y"></span> DSP Records
  </footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
