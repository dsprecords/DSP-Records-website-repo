<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSP Records Smart Link Manager</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:30px;
}

.logo{
    width:90%;
    max-width:500px;
    display:block;
    margin:0 auto 30px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:none;
    border-radius:5px;
}

button{
    margin-top:25px;
    padding:15px 25px;
    background:#ff5500;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:600px;
    margin-top:20px;
    background:#222;
    color:white;
    padding:15px;
}

.preview{
    width:100%;
    max-width:400px;
    display:none;
    margin:20px auto;
    border-radius:8px;
}

</style>
</head>

<body>

<img src="../assets/DSP-Smartlink-Logo.png" class="logo">

<h1>DSP Records Smart Link Manager</h1>

<label>Artist Name</label>
<input id="artist">

<label>Release Title</label>
<input id="title">

<label>Cover Artwork</label>
<input type="file" id="artwork" accept="image/*">

<img id="preview" class="preview">

<label>Beatport Link</label>
<input id="beatport">

<label>Traxsource Link</label>
<input id="traxsource">

<label>Juno Download Link</label>
<input id="juno">

<label>Apple Music Link</label>
<input id="apple">

<label>Amazon Music Link</label>
<input id="amazon">

<label>SoundCloud Link</label>
<input id="soundcloud">

<button onclick="generatePage()">Generate Release Page</button>

<textarea id="output"></textarea>

<script>

let artworkData="";

document.getElementById('artwork').addEventListener('change', function(e){

const file=e.target.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(event){

artworkData=event.target.result;

document.getElementById('preview').src=artworkData;
document.getElementById('preview').style.display='block';

};

reader.readAsDataURL(file);

}

});

function generatePage(){

let artist=document.getElementById('artist').value;
let title=document.getElementById('title').value;
let beatport=document.getElementById('beatport').value;
let traxsource=document.getElementById('traxsource').value;
let juno=document.getElementById('juno').value;
let apple=document.getElementById('apple').value;
let amazon=document.getElementById('amazon').value;
let soundcloud=document.getElementById('soundcloud').value;

let page=`<!DOCTYPE html>
<html>
<head>
<title>${title}</title>
<style>

body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:40px;
}

.logo{
width:90%;
max-width:500px;
margin-bottom:25px;
}

.cover{
width:100%;
max-width:400px;
border-radius:8px;
margin-bottom:25px;
}

.button{
display:block;
max-width:400px;
margin:15px auto;
padding:18px;
border-radius:6px;
font-weight:bold;
text-decoration:none;
color:white;
}

.beatport{background:#01FF95;color:black;}
.traxsource{background:#1E88E5;}
.juno{background:#7E57C2;}
.apple{background:#FA243C;}
.amazon{background:#00A8E1;}
.soundcloud{background:#FF5500;}

</style>
</head>

<body>

<img src="../../assets/DSP-Smartlink-Logo.png" class="logo">

<img src="${artworkData}" class="cover">

<h1>${title}</h1>

<h2>${artist}</h2>

<a class="button beatport" href="${beatport}">BUY ON BEATPORT</a>

<a class="button traxsource" href="${traxsource}">BUY ON TRAXSOURCE</a>

<a class="button juno" href="${juno}">BUY ON JUNO DOWNLOAD</a>

<a class="button apple" href="${apple}">BUY ON APPLE MUSIC</a>

<a class="button amazon" href="${amazon}">BUY ON AMAZON MUSIC</a>

<a class="button soundcloud" href="${soundcloud}">STREAM ON SOUNDCLOUD</a>

</body>
</html>`;

document.getElementById('output').value=page;

}

</script>

</body>
</html>
