<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSP Records Smart Link Manager</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:30px;
}

.logo{
    display:block;
    margin:0 auto 30px;
    max-width:350px;
    width:90%;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:none;
    border-radius:5px;
}

button{
    margin-top:25px;
    padding:15px 25px;
    background:#ff5500;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:350px;
    margin-top:20px;
    background:#222;
    color:white;
    padding:15px;
}
</style>
</head>

<body>

<img src="../assets/DSP-Smartlink-Logo.png" class="logo">

<h1>DSP Records Smart Link Manager</h1>

<label>Artist Name</label>
<input id="artist">

<label>Release Title</label>
<input id="title">

<label>Artwork URL</label>
<input id="artwork">

<label>Beatport Link</label>
<input id="beatport">

<label>Traxsource Link</label>
<input id="traxsource">

<label>Juno Download Link</label>
<input id="juno">

<label>Apple Music Link</label>
<input id="apple">

<label>Amazon Music Link</label>
<input id="amazon">

<label>SoundCloud Link</label>
<input id="soundcloud">

<button onclick="generatePage()">Generate Release Page</button>

<textarea id="output"></textarea>

<script>
function generatePage(){

let artist=document.getElementById('artist').value;
let title=document.getElementById('title').value;

let slug=title.toLowerCase()
.replace(/[^a-z0-9\s]/g,'')
.replace(/\s+/g,'-');

document.getElementById('output').value=
'Release URL:\nhttps://dsprecords.ca/smartlinks/releases/'+slug+'/';
}
</script>

</body>
</html>
