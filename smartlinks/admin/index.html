<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSP Records Release Manager</title>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:40px;
}

h1{
text-align:center;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:4px;
}

button{
margin-top:20px;
padding:15px 25px;
background:#ff5500;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

textarea{
width:100%;
height:300px;
margin-top:20px;
background:#222;
color:white;
padding:15px;
}
</style>
</head>

<body>

<h1>DSP Records Release Manager</h1>

<label>Artist Name</label>
<input id="artist">

<label>Release Title</label>
<input id="title">

<label>Artwork URL</label>
<input id="artwork">

<label>Beatport Link</label>
<input id="beatport">

<label>Traxsource Link</label>
<input id="traxsource">

<label>Juno Download Link</label>
<input id="juno">

<label>Apple Music Link</label>
<input id="apple">

<label>Amazon Music Link</label>
<input id="amazon">

<label>SoundCloud Link</label>
<input id="soundcloud">

<button onclick="generatePage()">
Generate Release Page
</button>

<textarea id="output"></textarea>

<script>

function generatePage(){

let artist=document.getElementById('artist').value;
let title=document.getElementById('title').value;

document.getElementById('output').value =
'Release Ready: ' + artist + ' - ' + title;

}

</script>

</body>
</html>
